<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#07060d">
<meta name="robots" content="noindex,nofollow">
<meta name="description" content="Something I made for you.">
<meta property="og:title" content="For Khushi">
<meta property="og:description" content="Something I made for you.">
<meta property="og:type" content="website">
<title>For Khushi</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;700&family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400;1,500&display=swap" rel="stylesheet">
<style>
/* The page is a night sky in every theme; tokens are repeated so it never flips to light. */
:root{
  --ink:#07060d; --ink-2:#120b1d; --gold:#ffd27a; --gold-hi:#fff0c9; --rose:#ff7d8c; --sun:#ffc533;
  --cream:#fff4e3; --muted:rgba(255,244,227,.66); --faint:rgba(255,244,227,.38);
  --lilac:#d3b6ea; --violet:#b48ac7; --yellow:#f8cf55; --blue:#a9d7dc; --paper-ink:#2b1733;
  --serif:"Cormorant Garamond","Iowan Old Style",Georgia,serif;
  --hand:"Caveat","Segoe Script","Bradley Hand",cursive;
  color-scheme:dark;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--ink:#07060d;--cream:#fff4e3}}
:root[data-theme="dark"]{--ink:#07060d;--cream:#fff4e3}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
html,body{height:100%;margin:0}
body{
  background:var(--ink);
  background-image:radial-gradient(120% 80% at 50% 28%,#1d1233 0%,#0d0818 48%,#05040a 100%);
  color:var(--cream);font-family:var(--serif);font-size:19px;line-height:1.5;
  overflow:hidden;overscroll-behavior:none;-webkit-tap-highlight-color:transparent;
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;
}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
button:focus-visible,.star:focus-visible{outline:2px solid var(--gold);outline-offset:3px;border-radius:6px}
#bg{position:fixed;left:0;top:0;width:100%;height:100%;z-index:0;pointer-events:none}

.scene{position:fixed;left:0;right:0;top:0;bottom:0;z-index:5;display:flex;flex-direction:column;
  padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px);transition:opacity .9s ease,visibility .9s}
.scene.off{opacity:0;visibility:hidden;pointer-events:none}

/* word-by-word reveal, used for her name, the intro, my answers and the finale */
.wrap{display:block;max-width:100%;text-align:center}
#mine .wrap{text-align:center}
.w{display:inline-block;white-space:pre-wrap;opacity:0;filter:blur(5px);transform:translateY(5px);animation:wIn .9s ease forwards}
@keyframes wIn{to{opacity:1;filter:blur(0);transform:none}}

/* ---------- intro ---------- */
#intro{align-items:center;justify-content:center;text-align:center;padding-left:28px;padding-right:28px;cursor:pointer}
#introText{font-size:clamp(26px,6.4vw,38px);line-height:1.38;font-style:italic;font-weight:400;max-width:20em;min-height:6.5em;display:flex;align-items:center;justify-content:center}
#introText.name{font-style:normal;font-size:clamp(48px,14vw,84px);font-weight:600;letter-spacing:.02em}
#introHint{position:absolute;bottom:calc(36px + env(safe-area-inset-bottom,0px));left:0;right:0;font-size:16px;color:var(--faint);opacity:0;transition:opacity 1s}
#introHint.on{opacity:1;animation:breathe 2.6s ease-in-out infinite}
#beginBtn{margin-top:34px;padding:15px 30px;border:1px solid var(--gold);border-radius:999px;color:var(--gold-hi);font-size:21px;letter-spacing:.02em;
  background:radial-gradient(circle at 50% 120%,rgba(255,210,122,.28),transparent 70%);opacity:0;transition:opacity 1s .2s}
#beginBtn.on{opacity:1}
#soundNote{margin-top:20px;font-size:15px;color:var(--faint);opacity:0;transition:opacity 1s .4s}
#soundNote.on{opacity:1}
@keyframes breathe{50%{opacity:.35}}

/* ---------- sky ---------- */
#hud{display:flex;align-items:center;justify-content:space-between;padding:14px 20px 0;gap:12px;flex:0 0 auto}
#hud button,#hud .for{white-space:nowrap}
#hud .for{font-size:19px;font-style:italic;color:var(--muted)}
#hudRight{display:flex;align-items:center;gap:14px}
#muteBtn{font-size:15px;color:var(--muted);padding:6px 4px;min-height:44px;min-width:44px}
#endBtn{display:none;padding:11px 18px;border:1px solid var(--gold);border-radius:999px;color:var(--gold-hi);font-size:17px;animation:glowPulse 2.4s ease-in-out infinite}
#endBtn.on{display:block}
@keyframes glowPulse{50%{box-shadow:0 0 18px rgba(255,210,122,.45)}}
#progress{flex:0 0 auto;padding:10px 24px 0;text-align:center}
#count{font-size:17px;color:var(--muted);letter-spacing:.03em}
#bar{height:2px;width:min(220px,60%);margin:8px auto 0;background:rgba(255,244,227,.12);border-radius:2px;overflow:hidden}
#barFill{height:100%;width:0;background:linear-gradient(90deg,var(--rose),var(--gold));transition:width .8s ease}
#skyWrap{flex:1 1 auto;min-height:0;display:flex;align-items:center;justify-content:center;padding:4px 10px}
#skySvg{width:100%;height:100%;max-width:560px;touch-action:manipulation;overflow:visible}
#hud,#progress,#caption{transition:opacity .8s}
body.ending #hud,body.ending #progress,body.ending #caption{opacity:0;pointer-events:none}
#caption{flex:0 0 auto;text-align:center;padding:0 28px 22px;min-height:3.4em;font-style:italic;font-size:20px;color:var(--muted)}
#caption.swap{animation:capIn 1s ease}
@keyframes capIn{from{opacity:0}to{opacity:1}}

.wire{fill:none;stroke:var(--gold);stroke-width:.9;opacity:.2;transition:opacity 1.2s}
.star{cursor:pointer;outline:none}
.star .hit{fill:transparent}
.star .dot{fill:#cdd6ff;opacity:.5;animation:tw 3.6s ease-in-out infinite;animation-delay:var(--d,0s)}
.star .glow{opacity:0;transition:opacity .8s}
.star .spark{fill:var(--gold-hi);opacity:0;transform-box:fill-box;transform-origin:center;transform:scale(.2) rotate(-40deg)}
.star.lit .dot{fill:var(--gold-hi);opacity:1;animation:none}
.star.lit .glow{opacity:.85}
.star.lit .spark{opacity:.95;transform:scale(1) rotate(0);transition:transform .9s cubic-bezier(.2,1.4,.4,1),opacity .6s}
.star.lit .bulb{animation:bulb 4.2s ease-in-out infinite;animation-delay:var(--d,0s)}
.star.last .dot{fill:var(--rose);opacity:.9}
.star.last .ring{fill:none;stroke:var(--rose);stroke-width:.8;opacity:.0;transform-box:fill-box;transform-origin:center;animation:ringOut 3s ease-out infinite}
.star.last.ready .ring{opacity:.8}
.star.last.lit .dot{fill:var(--gold-hi)}
@keyframes tw{50%{opacity:.18}}
@keyframes bulb{50%{opacity:.78}}
@keyframes ringOut{0%{transform:scale(.6);opacity:.9}100%{transform:scale(3.2);opacity:0}}

/* ---------- card ---------- */
#sheet{position:fixed;left:0;right:0;top:0;bottom:0;z-index:30;visibility:hidden}
#sheet.open{visibility:visible}
#sheet .backdrop{position:absolute;left:0;right:0;top:0;bottom:0;background:rgba(5,3,10,.55);opacity:0;transition:opacity .45s}
#sheet.open .backdrop{opacity:1}
#panel{position:absolute;left:0;right:0;bottom:0;margin:0 auto;max-width:560px;max-height:88%;overflow:auto;
  background:linear-gradient(180deg,rgba(28,17,46,.97),rgba(14,9,24,.98));border-top:1px solid rgba(255,210,122,.25);
  border-radius:26px 26px 0 0;padding:20px 22px calc(22px + env(safe-area-inset-bottom,0px));
  transform:translateY(105%);transition:transform .6s cubic-bezier(.2,.9,.25,1);box-shadow:0 -20px 60px rgba(0,0,0,.6)}
#sheet.open #panel{transform:none}
#cardTop{display:flex;align-items:center;justify-content:space-between;color:var(--muted);font-size:17px;font-style:italic}
#closeBtn{font-size:30px;line-height:1;padding:2px 8px;color:var(--muted);min-width:44px;min-height:44px}
#paper{position:relative;margin:14px 2px 6px;padding:26px 22px 28px;border-radius:3px;transform:rotate(-1.1deg);
  background:var(--pc,var(--lilac));color:var(--paper-ink);box-shadow:0 12px 30px rgba(0,0,0,.45),0 2px 0 rgba(255,255,255,.18) inset;
  background-image:linear-gradient(90deg,transparent 49.4%,rgba(0,0,0,.09) 50%,rgba(255,255,255,.18) 50.6%,transparent 51.4%),
                   linear-gradient(0deg,transparent 49.4%,rgba(0,0,0,.07) 50%,rgba(255,255,255,.14) 50.6%,transparent 51.4%);
  animation:paperIn .8s cubic-bezier(.2,1.2,.4,1)}
@keyframes paperIn{from{opacity:0;transform:translateY(22px) rotate(-5deg) scale(.96)}}
#paper.lilac{--pc:var(--lilac)} #paper.violet{--pc:var(--violet)} #paper.yellow{--pc:var(--yellow)} #paper.blue{--pc:var(--blue)}
#her{margin:0;font-family:var(--hand);font-weight:700;font-size:clamp(30px,8.4vw,42px);line-height:1.12;text-align:left}
#answer{margin-top:20px;min-height:5.4em}
#revealBtn{display:block;margin:0 auto;padding:11px 24px;border:1px solid rgba(255,210,122,.6);border-radius:999px;color:var(--gold-hi);font-size:20px;font-style:italic}
#revealBtn.gone{display:none}
#mine{margin:0;font-size:clamp(22px,5.6vw,27px);line-height:1.38;font-style:italic;font-weight:500;color:var(--gold-hi);text-align:center;padding:0 4px}
#actions{display:flex;justify-content:center;margin-top:16px;min-height:46px}
#nextBtn{padding:12px 28px;border-radius:999px;background:linear-gradient(135deg,rgba(255,125,140,.9),rgba(255,197,51,.9));color:#2b1020;font-weight:600;font-size:20px;opacity:0;transition:opacity .8s}
#nextBtn.on{opacity:1}

/* ---------- finale ---------- */
#finale{z-index:20;align-items:center;justify-content:center;text-align:center;padding-left:26px;padding-right:26px;background:radial-gradient(90% 70% at 50% 60%,rgba(40,18,52,.6),rgba(5,3,10,.9));cursor:pointer}
#fLine{font-size:clamp(25px,6.2vw,36px);line-height:1.4;font-style:italic;max-width:19em;min-height:7.8em;display:flex;align-items:center;justify-content:center;transition:opacity .6s}
#fLine.out{opacity:0}
#fLine.big{font-style:normal;font-weight:600;font-size:clamp(40px,11vw,64px);color:var(--gold-hi)}
#fSign{font-family:var(--hand);font-size:34px;color:var(--rose);min-height:1.6em;opacity:0;transition:opacity 1.4s}
#fSign.on{opacity:1}
#heartBox{position:relative;width:min(58vw,250px);aspect-ratio:1/.95;margin-top:6px;touch-action:none;cursor:pointer}
#heartSvg{width:100%;height:100%;overflow:visible;filter:drop-shadow(0 0 14px rgba(255,125,140,.35))}
#heartSvg .outline{fill:none;stroke:var(--gold);stroke-width:2;stroke-dasharray:1;stroke-dashoffset:1}
#heartSvg.drawn .outline{animation:draw 3.2s ease forwards}
@keyframes draw{to{stroke-dashoffset:0}}
#heartSvg.beat{animation:beat .8s ease-in-out infinite}
@keyframes beat{0%,100%{transform:scale(1)}18%{transform:scale(1.07)}32%{transform:scale(.99)}46%{transform:scale(1.05)}}
#fHint{min-height:2.6em;margin-top:14px;font-size:20px;font-style:italic;color:var(--muted);opacity:0;transition:opacity 1s}
#fHint.on{opacity:1}
#backBtn{padding:10px 20px;border:1px solid rgba(255,244,227,.3);border-radius:999px;color:var(--muted);font-size:17px;display:none}
#backBtn.on{display:inline-block}

/* ---------- particles & toast ---------- */
#fx{position:fixed;left:0;right:0;top:0;bottom:0;z-index:60;pointer-events:none;overflow:hidden}
.p{position:absolute;left:0;top:0;width:6px;height:6px;border-radius:50%;background:var(--gold-hi);box-shadow:0 0 10px 2px rgba(255,210,122,.8)}
#toast{position:fixed;left:50%;bottom:calc(90px + env(safe-area-inset-bottom,0px));transform:translateX(-50%) translateY(12px);z-index:70;
  background:rgba(20,12,34,.95);border:1px solid rgba(255,210,122,.35);padding:10px 18px;border-radius:14px;font-style:italic;font-size:18px;
  opacity:0;transition:opacity .5s,transform .5s;pointer-events:none;max-width:86%;text-align:center}
#toast.on{opacity:1;transform:translateX(-50%)}


/* ---------- memory hearts ---------- */
.mem .glow{opacity:0;transition:opacity .8s}
.mem .heart{fill:var(--rose);opacity:.26;transform-box:fill-box;transform-origin:center;transition:opacity .8s}
.mem .ring{fill:none;stroke:var(--rose);stroke-width:.9;opacity:0;transform-box:fill-box;transform-origin:center}
.mem.ready .glow{opacity:.95}
.mem.ready .heart{opacity:1;animation:hb 1.7s ease-in-out infinite}
.mem.ready .ring{opacity:.8;animation:ringOut 3s ease-out infinite}
.mem.seen .heart{opacity:1;fill:#ff9aa6;animation:none}
.mem.seen .glow{opacity:.5}
.mem.seen .ring{animation:none;opacity:0}
@keyframes hb{50%{transform:scale(1.28)}}
#paper.memory{--pc:#fff1e0;transform:rotate(1deg)}
#paper.memory::before{content:"";position:absolute;left:50%;top:-12px;width:78px;height:22px;margin-left:-39px;background:rgba(255,125,140,.55);transform:rotate(-3deg);border-radius:2px}
#her.memtitle{font-size:clamp(28px,7.6vw,38px);text-align:center;color:#8f2f48}
.rip{position:absolute;left:0;top:0;width:46px;height:46px;margin:-23px 0 0 -23px;border-radius:50%;border:1.5px solid rgba(255,210,122,.85)}

/* ---------- letter ---------- */
body.reading #finale,body.reading #sky{opacity:0 !important}
#letter{z-index:25;background:radial-gradient(100% 70% at 50% 20%,rgba(36,18,52,.97),rgba(6,4,12,.985));visibility:hidden}
#letter:not(.off){visibility:visible}
#letterTop{position:absolute;left:0;right:0;top:0;z-index:3;display:flex;justify-content:space-between;align-items:center;padding:calc(12px + env(safe-area-inset-top,0px)) 18px 26px;background:linear-gradient(180deg,rgba(8,5,15,.96) 55%,rgba(8,5,15,0));pointer-events:none}
#letterTop button{pointer-events:auto}
#letterClose{padding:8px 16px;border:1px solid rgba(255,244,227,.3);border-radius:999px;color:var(--muted);font-size:17px;background:rgba(10,6,18,.6)}
#lprog{position:absolute;left:0;top:0;height:2px;width:0;background:linear-gradient(90deg,var(--rose),var(--gold));z-index:4}
#letterScroll{flex:1 1 auto;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;padding:22vh 26px 24vh;-webkit-user-select:none;user-select:none}
.blk{max-width:30em;margin:0 auto 24vh;text-align:center;opacity:0;transform:translateY(46px);filter:blur(4px);transition:opacity 1.1s ease,transform 1.1s cubic-bezier(.2,.8,.2,1),filter 1.1s}
.blk.in{opacity:1;transform:none;filter:none}
.blk .gem{width:22px;height:22px;margin:0 auto 14px;background:var(--gold-hi);clip-path:polygon(50% 0,60% 40%,100% 50%,60% 60%,50% 100%,40% 60%,0 50%,40% 40%);filter:drop-shadow(0 0 8px rgba(255,210,122,.9));animation:gem 3.2s ease-in-out infinite}
@keyframes gem{50%{transform:scale(.7) rotate(45deg);opacity:.7}}
.blk h2{margin:0 0 12px;font-family:var(--hand);font-weight:700;font-size:clamp(34px,9vw,46px);line-height:1.05;color:var(--gold)}
.blk p{margin:0;font-size:clamp(21px,5.4vw,25px);line-height:1.5;font-style:italic;color:var(--cream)}
.blk.diya .gem{clip-path:none;background:none;width:auto;height:auto;font-size:34px;line-height:1;filter:drop-shadow(0 0 12px rgba(255,170,60,.95));animation:flicker 2.6s ease-in-out infinite}
@keyframes flicker{50%{transform:scale(.92);opacity:.85}}
.blk.msg{margin-bottom:9vh;text-align:left;max-width:27em}
.blk.msg p{font-style:normal;font-size:clamp(20px,5vw,23px);line-height:1.62;color:var(--cream)}
.blk.msg strong{color:var(--gold-hi);font-weight:600}
.blk.ask{margin:6vh auto 14vh}
.blk.ask h2{font-size:clamp(40px,11vw,60px);line-height:1.12;color:var(--rose);text-shadow:0 0 28px rgba(255,125,140,.45)}
.blk.sign h2{color:var(--rose);font-size:clamp(44px,12vw,60px)}
.blk.sign .date{margin-top:14px;font-size:17px;color:var(--faint);font-style:normal}
#moreBtn{margin-top:6px;padding:11px 22px;border:1px solid var(--gold);border-radius:999px;color:var(--gold-hi);font-size:18px;display:none;animation:glowPulse 2.4s ease-in-out infinite}
#moreBtn.on{display:inline-block}
#finaleBtns{display:flex;gap:12px;flex-wrap:wrap;justify-content:center;margin-top:8px}

@media (prefers-reduced-motion:reduce){
  .w{animation:none;opacity:1;filter:none;transform:none}
  .blk{opacity:1;transform:none;filter:none}
  *{animation-duration:.01ms !important;animation-iteration-count:1 !important;transition-duration:.01ms !important}
}
</style>
</head>
<body>
<canvas id="bg"></canvas>

<!-- INTRO -->
<section id="intro" class="scene" aria-live="polite">
  <div id="introText"></div>
  <button id="beginBtn" type="button">Light the first star</button>
  <div id="soundNote">Best with sound on, somewhere quiet.</div>
  <div id="introHint">touch anywhere to go on</div>
</section>

<!-- SKY -->
<section id="sky" class="scene off">
  <div id="hud">
    <span class="for">for Khushi</span>
    <span id="hudRight">
      <button id="endBtn" type="button">One more thing</button>
      <button id="muteBtn" type="button" aria-pressed="false">sound on</button>
    </span>
  </div>
  <div id="progress">
    <div id="count">0 of 100 lit</div>
    <div id="bar"><div id="barFill"></div></div>
  </div>
  <div id="skyWrap"><svg id="skySvg" viewBox="0 0 400 370" role="group" aria-label="A heart made of 100 stars"></svg></div>
  <div id="caption">Touch a star.</div>
</section>

<!-- CARD -->
<div id="sheet" aria-hidden="true">
  <div class="backdrop" id="backdrop"></div>
  <div id="panel" role="dialog" aria-modal="true" aria-labelledby="cardNo">
    <div id="cardTop"><span id="cardNo"></span><button id="closeBtn" type="button" aria-label="Close">&times;</button></div>
    <div id="paper"><p id="her"></p></div>
    <div id="answer">
      <button id="revealBtn" type="button">What I would say back</button>
      <p id="mine"></p>
    </div>
    <div id="actions"><button id="nextBtn" type="button">Light the next star</button></div>
  </div>
</div>

<!-- FINALE -->
<section id="finale" class="scene off" aria-live="polite">
  <div id="fLine"></div>
  <div id="heartBox">
    <svg id="heartSvg" viewBox="0 0 200 190" aria-label="Hold the heart">
      <defs>
        <linearGradient id="hg" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color="#ff7d8c"/><stop offset="1" stop-color="#ffd27a"/></linearGradient>
        <clipPath id="hc"><rect id="hRect" x="0" y="190" width="200" height="0"/></clipPath>
      </defs>
      <path id="hFill" fill="url(#hg)" clip-path="url(#hc)" d=""/>
      <path id="hOutline" class="outline" pathLength="1" d=""/>
    </svg>
  </div>
  <div id="fHint"></div>
  <div id="fSign"></div>
  <div id="finaleBtns">
    <button id="moreBtn" type="button">Keep reading</button>
    <button id="backBtn" type="button">Back to the sky</button>
  </div>
</section>

<!-- LETTER -->
<section id="letter" class="scene off" aria-label="A letter for Khushi">
  <div id="lprog"></div>
  <div id="letterTop"><span></span><button id="letterClose" type="button">Back</button></div>
  <div id="letterScroll"><div id="letterBody"></div></div>
</section>

<div id="fx"></div>
<div id="toast" role="status"></div>

<script>
/* =====================================================================
   EVERYTHING PERSONAL LIVES HERE. Edit the text, republish, done.
   ===================================================================== */
const CONFIG = {
  name: "Khushi",
  signature: "Kunj",
  date: "12 October 2026",
  intro: [
    "Khushi.",
    "Happy 18 months, my love. And happy Navratri.",
    "On my birthday you gave me a heart. Inside it, 100 things, folded into paper, in your handwriting.",
    "I read every single one.",
    "I didn't want to answer with a message. A message is too small for this.",
    "So I built you a sky. Every star in it is a sentence you wrote.",
    "Take your time. You gave me yours."
  ],
  finale: [
    "100 stars. Every one began as your handwriting.",
    "I saw your smile on an app I barely used, and I wanted you in my life forever. It is still my entire universe.",
    "You came into my life, and I found the courage to build Shatakam. I never thought I could. You did.",
    "A hand-made card. 100 reasons in your handwriting. Three T-shirts. A watch, so I'll always have a way to count the minutes I get to spend with you.",
    "I can't out-write you. So I built you a sky.",
    "Happy 18 months. From where I stand, you are the brightest thing in it."
  ],
  finalLine: "I love you, Khushi.",
  afterHint: "I bet you're smiling right now. That's my entire universe.",
  holdPrompt: "Now put your finger on the heart, and hold."
};

/* Her 100 lines, exactly as she wrote them (spelling tidied). */
const LINES = [

/* ---------- audio (all synthesised, nothing to download) ---------- */
let actx = null, master = null, muted = store("k100:mute") === "1";
function audio(){
  if(muted) return null;
  if(!actx){
    const AC = window.AudioContext || window.webkitAudioContext; if(!AC) return null;
    actx = new AC(); master = actx.createGain(); master.gain.value = .55;
    const d = actx.createDelay(); d.delayTime.value = .3; const fb = actx.createGain(); fb.gain.value = .34;
    const wet = actx.createGain(); wet.gain.value = .4;
    master.connect(actx.destination); master.connect(d); d.connect(fb); fb.connect(d); d.connect(wet); wet.connect(actx.destination);
  }
  if(actx.state === "suspended") actx.resume();
  return actx;
}
function chime(freq, o){
  o = o || {}; const c = audio(); if(!c) return;
  const t = c.currentTime + (o.delay || 0), dur = o.dur || 1.8, gain = o.gain || .16;
  [[1,1],[2,.28],[3,.1]].forEach(function(h){
    const osc = c.createOscillator(), g = c.createGain();
    osc.type = "sine"; osc.frequency.value = freq * h[0];
    g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(gain * h[1], t + .012);
    g.gain.exponentialRampToValueAtTime(.0001, t + dur / h[0] + .3);
    osc.connect(g); g.connect(master); osc.start(t); osc.stop(t + dur + .4);
  });
}
const PENTA = [0,2,4,7,9];
function noteFor(n){ const i = n % 5, oct = Math.floor((n * 7 % 10) / 5); return 523.25 * Math.pow(2, (PENTA[i] + 12 * oct) / 12); }
function thump(){
  const c = audio(); if(!c) return; const t = c.currentTime;
  [0, .17].forEach(function(off, i){
    const o = c.createOscillator(), g = c.createGain(); o.type = "sine";
    o.frequency.setValueAtTime(i ? 62 : 72, t + off); o.frequency.exponentialRampToValueAtTime(38, t + off + .16);
    g.gain.setValueAtTime(0, t + off); g.gain.linearRampToValueAtTime(i ? .5 : .7, t + off + .01); g.gain.exponentialRampToValueAtTime(.001, t + off + .22);
    o.connect(g); g.connect(c.destination); o.start(t + off); o.stop(t + off + .3);
  });
}
function chord(notes){ notes.forEach(function(f, i){ chime(f, {delay: i * .18, dur: 3.4, gain: .13}); }); }

/* ---------- helpers ---------- */
function revealWords(el, text, step){
  step = step || 120; el.textContent = "";
  const words = text.split(" "), wrap = document.createElement("span"); wrap.className = "wrap"; el.appendChild(wrap);
  words.forEach(function(w, i){
    const s = document.createElement("span"); s.className = "w"; s.textContent = w + (i < words.length - 1 ? " " : "");
    s.style.animationDelay = (i * step) + "ms"; wrap.appendChild(s);
  });
  return words.length * step + 900;
}
let toastT;
function toast(msg){ const t = $("toast"); t.textContent = msg; t.classList.add("on"); clearTimeout(toastT); toastT = setTimeout(function(){ t.classList.remove("on"); }, 3200); }
function burst(x, y, n, spread, hue){
  if(reduced) return; const fx = $("fx");
  for(let i = 0; i < n; i++){
    const p = document.createElement("div"); p.className = "p";
    const a = Math.random() * Math.PI * 2, d = (.35 + Math.random() * .65) * spread, s = .5 + Math.random() * 1.1;
    if(hue && Math.random() < .4) p.style.background = "#ff9aa6";
    fx.appendChild(p);
    const an = p.animate([
      {transform: "translate(" + x + "px," + y + "px) scale(" + s + ")", opacity: 1},
      {transform: "translate(" + (x + Math.cos(a) * d) + "px," + (y + Math.sin(a) * d + 22) + "px) scale(0)", opacity: 0}
    ], {duration: 900 + Math.random() * 900, easing: "cubic-bezier(.1,.7,.3,1)"});
    an.onfinish = function(){ p.remove(); };
  }
}

/* ---------- background twinkle + shooting stars ---------- */
const bg = $("bg"), bctx = bg.getContext("2d");
let BW = 0, BH = 0, bstars = [], shoots = [], nextShoot = 4000;
function sizeBg(){
  const dpr = Math.min(window.devicePixelRatio || 1, 2); BW = innerWidth; BH = innerHeight;
  bg.width = BW * dpr; bg.height = BH * dpr; bctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  const n = Math.round(BW * BH / 5000); bstars = [];
  for(let i = 0; i < n; i++) bstars.push({x: Math.random() * BW, y: Math.random() * BH, r: Math.random() * 1.2 + .25, s: .4 + Math.random() * 1.4, p: Math.random() * 6.28, w: Math.random() < .2});
}
function loopBg(t){
  bctx.clearRect(0, 0, BW, BH);
  for(const s of bstars){
    const a = reduced ? .5 : .22 + .6 * (.5 + .5 * Math.sin(t / 1000 * s.s + s.p));
    bctx.globalAlpha = a; bctx.fillStyle = s.w ? "#ffe6b0" : "#dfe5ff";
    bctx.beginPath(); bctx.arc(s.x, s.y, s.r, 0, 6.283); bctx.fill();
  }
  if(!reduced){
    if(t > nextShoot){ nextShoot = t + 7000 + Math.random() * 9000;
      shoots.push({x: Math.random() * BW * .8 + BW * .2, y: Math.random() * BH * .35, vx: -5 - Math.random() * 3, vy: 2.2 + Math.random() * 1.5, life: 0}); }
    for(let i = shoots.length - 1; i >= 0; i--){
      const s = shoots[i]; s.x += s.vx; s.y += s.vy; s.life += 1;
      const g = bctx.createLinearGradient(s.x, s.y, s.x - s.vx * 9, s.y - s.vy * 9);
      g.addColorStop(0, "rgba(255,240,201,.9)"); g.addColorStop(1, "rgba(255,240,201,0)");
      bctx.globalAlpha = Math.max(0, 1 - s.life / 60); bctx.strokeStyle = g; bctx.lineWidth = 1.6;
      bctx.beginPath(); bctx.moveTo(s.x, s.y); bctx.lineTo(s.x - s.vx * 9, s.y - s.vy * 9); bctx.stroke();
      if(s.life > 60) shoots.splice(i, 1);
    }
  }
  bctx.globalAlpha = 1; requestAnimationFrame(loopBg);
}
sizeBg(); window.addEventListener("resize", sizeBg); requestAnimationFrame(loopBg);

/* ---------- the heart-shaped sky ---------- */
const SVGNS = "http://www.w3.org/2000/svg";
function heartXY(t){ return [16 * Math.pow(Math.sin(t), 3), 13 * Math.cos(t) - 5 * Math.cos(2 * t) - 2 * Math.cos(3 * t) - Math.cos(4 * t)]; }
const SC = 11.2, OX = 200, OY = 156, CYH = -2.6;
function toSvg(x, y, k){ return [OX + k * x * SC, OY - (CYH + k * (y - CYH)) * SC]; }
const TABLE = []; let ACC = 0;
(function(){ let prev = null; const M = 1600;
  for(let i = 0; i <= M; i++){ const t = i / M * Math.PI * 2, p = heartXY(t); if(prev) ACC += Math.hypot(p[0] - prev[0], p[1] - prev[1]); TABLE.push({t: t, len: ACC}); prev = p; } })();
function tAt(frac){
  const target = (((frac % 1) + 1) % 1) * ACC; let lo = 0, hi = TABLE.length - 1;
  while(lo < hi){ const mid = (lo + hi) >> 1; if(TABLE[mid].len < target) lo = mid + 1; else hi = mid; }
  return TABLE[lo].t;
}
function mulberry(a){ return function(){ a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
const rnd = mulberry(1210);
function ring(N, k, phase, jit){
  const pts = [];
  for(let i = 0; i < N; i++){
    const xy = heartXY(tAt(i / N + phase)); let p = toSvg(xy[0], xy[1], k);
    if(jit){ p[0] += (rnd() - .5) * jit; p[1] += (rnd() - .5) * jit; }
    pts.push(p);
  }
  return pts;
}
const positions = [].concat(ring(46, 1, 0, 0), ring(31, .68, .5 / 31, 5), ring(17, .38, .25 / 17, 4), ring(5, .2, 0, 0));
/* shuffle numbers 1..99 across the 99 outer positions; star 100 sits alone in the middle */
const nums = Array.from({length: 99}, function(_, i){ return i + 1; });
for(let i = nums.length - 1; i > 0; i--){ const j = Math.floor(rnd() * (i + 1)); const tmp = nums[i]; nums[i] = nums[j]; nums[j] = tmp; }
const STARS = positions.map(function(p, i){ return {n: nums[i], x: p[0], y: p[1], r: 1.7 + rnd() * 1.4, d: (rnd() * -4).toFixed(2) + "s"}; });
STARS.push({n: 100, x: OX, y: OY - CYH * SC, r: 4.6, d: "0s", last: true});
const BYNUM = {}; STARS.forEach(function(s){ BYNUM[s.n] = s; });

const svg = $("skySvg");
function el(tag, attrs){ const e = document.createElementNS(SVGNS, tag); for(const k in attrs) e.setAttribute(k, attrs[k]); return e; }
(function buildSky(){
  const defs = el("defs", {});
  defs.innerHTML = '<radialGradient id="glow"><stop offset="0" stop-color="#ffd27a" stop-opacity=".9"/><stop offset=".35" stop-color="#ffd27a" stop-opacity=".28"/><stop offset="1" stop-color="#ffd27a" stop-opacity="0"/></radialGradient><radialGradient id="rglow"><stop offset="0" stop-color="#ff7d8c" stop-opacity=".85"/><stop offset=".4" stop-color="#ff7d8c" stop-opacity=".26"/><stop offset="1" stop-color="#ff7d8c" stop-opacity="0"/></radialGradient>';
  svg.appendChild(defs);
  let d = ""; for(let i = 0; i <= 240; i++){ const xy = heartXY(i / 240 * Math.PI * 2), p = toSvg(xy[0], xy[1], 1); d += (i ? "L" : "M") + p[0].toFixed(1) + "," + p[1].toFixed(1); }
  svg.appendChild(el("path", {d: d + "Z", class: "wire", id: "wire"}));
  STARS.forEach(function(s){
    const g = el("g", {class: "star" + (s.last ? " last" : ""), "data-n": s.n, tabindex: "0", role: "button", "aria-label": "Star " + s.n, transform: "translate(" + s.x.toFixed(1) + " " + s.y.toFixed(1) + ")"});
    g.style.setProperty("--d", s.d);
    g.appendChild(el("circle", {class: "hit", r: 13}));
    g.appendChild(el("circle", {class: "glow bulb", r: s.last ? 26 : 15, fill: "url(#glow)"}));
    if(s.last) g.appendChild(el("circle", {class: "ring", r: 7}));
    const R = s.last ? 12 : 7;
    g.appendChild(el("path", {class: "spark", d: "M0," + -R + " Q.9,-.9 " + R + ",0 Q.9,.9 0," + R + " Q-.9,.9 " + -R + ",0 Q-.9,-.9 0," + -R + "Z"}));
    g.appendChild(el("circle", {class: "dot", r: s.r}));
    g.addEventListener("keydown", function(e){ if(e.key === "Enter" || e.key === " "){ e.preventDefault(); openStar(s.n); } });
    svg.appendChild(g); s.node = g;
  });
})();
/* memory hearts around the edge of the sky */
const MEM_POS = [[200,36],[34,236],[366,236],[70,322],[330,322],[200,364]];
const MEMS = MEMORIES.map(function(m, i){ return {i: i, x: MEM_POS[i][0], y: MEM_POS[i][1], at: m.at, title: m.title, body: m.body}; });
let seen = new Set();
try{ const raw = store("k100:mem"); if(raw) JSON.parse(raw).forEach(function(i){ seen.add(i); }); }catch(e){}
MEMS.forEach(function(m){
  const g = el("g", {class: "star mem", tabindex: "0", role: "button", "aria-label": "A memory", transform: "translate(" + m.x + " " + m.y + ")"});
  g.appendChild(el("circle", {class: "glow", r: 22, fill: "url(#rglow)"}));
  g.appendChild(el("circle", {class: "ring", r: 8}));
  g.appendChild(el("path", {class: "heart", d: "M0,6.5 C-10,-1 -6.5,-9.5 0,-4.2 C6.5,-9.5 10,-1 0,6.5Z"}));
  g.addEventListener("keydown", function(e){ if(e.key === "Enter" || e.key === " "){ e.preventDefault(); openMemory(m.i); } });
  svg.appendChild(g); m.node = g;
});
function svgPoint(e){ const pt = svg.createSVGPoint(); pt.x = e.clientX; pt.y = e.clientY; return pt.matrixTransform(svg.getScreenCTM().inverse()); }
let pressed = false, trailT = 0;
svg.addEventListener("pointerdown", function(e){
  if(finaleOn) return; pressed = true;
  const p = svgPoint(e); let best = null, bd = 1e9, isMem = false;
  STARS.forEach(function(s){ const dd = Math.hypot(s.x - p.x, s.y - p.y); if(dd < bd){ bd = dd; best = s; isMem = false; } });
  MEMS.forEach(function(m){ const dd = Math.hypot(m.x - p.x, m.y - p.y) - 6; if(dd < bd){ bd = dd; best = m; isMem = true; } });
  if(best && bd < 26){ if(isMem) openMemory(best.i); else openStar(best.n); }
  else ripple(e.clientX, e.clientY);
});
svg.addEventListener("pointermove", function(e){
  if(!pressed || reduced || finaleOn) return; const now = performance.now(); if(now - trailT < 45) return; trailT = now;
  burst(e.clientX, e.clientY, 2, 26);
});
window.addEventListener("pointerup", function(){ pressed = false; }); window.addEventListener("pointercancel", function(){ pressed = false; });
function ripple(x, y){
  if(!reduced){
    const r = document.createElement("div"); r.className = "rip"; $("fx").appendChild(r);
    const a = r.animate([{transform: "translate(" + x + "px," + y + "px) scale(.2)", opacity: .9}, {transform: "translate(" + x + "px," + y + "px) scale(2.2)", opacity: 0}], {duration: 900, easing: "ease-out"});
    a.onfinish = function(){ r.remove(); };
  }
  burst(x, y, 6, 40); chime(523.25 * Math.pow(2, PENTA[Math.floor(Math.random() * 5)] / 12), {gain: .045, dur: 1.4}); vib(8);
}
function starClient(n){
  const s = BYNUM[n], pt = svg.createSVGPoint(); pt.x = s.x; pt.y = s.y;
  const q = pt.matrixTransform(svg.getScreenCTM()); return [q.x, q.y];
}

/* ---------- progress ---------- */
let lit = new Set();
try{ const raw = store("k100:lit"); if(raw) JSON.parse(raw).forEach(function(n){ if(n >= 1 && n <= 100) lit.add(n); }); }catch(e){}
const hm = location.hash.match(/lit=(\d+)/);              // testing aid: add #lit=99 to the link to jump ahead
if(hm){ lit = new Set(); const k = Math.min(100, +hm[1]); for(let i = 1; i <= k; i++) lit.add(i); }
function saveLit(){ store("k100:lit", JSON.stringify(Array.from(lit))); }
const CAPTIONS = {0: "Touch a star.", 1: "There's no order. Pick any.", 10: "That's ten of your sentences, lit.", 25: "A quarter of your sky.", 50: "Halfway. There's no hurry.", 75: "Three quarters. Look how bright it's getting.", 90: "Ten left.", 99: "One star left. The bright one, in the middle.", 100: "Every star is lit."};
let lastCap = -1;
function updateHud(){
  const n = lit.size; $("count").textContent = n + " of 100 lit"; $("barFill").style.width = n + "%";
  $("wire").style.opacity = (.2 + .55 * n / 100).toFixed(2);
  const keys = Object.keys(CAPTIONS).map(Number).filter(function(k){ return k <= n; });
  const key = keys.length ? Math.max.apply(null, keys) : 0;
  if(key !== lastCap){ lastCap = key; const c = $("caption"); c.textContent = CAPTIONS[key]; c.classList.remove("swap"); void c.offsetWidth; c.classList.add("swap"); }
  const last = BYNUM[100].node; if(n >= 99) last.classList.add("ready");
  $("endBtn").classList.toggle("on", n >= 100);
  MEMS.forEach(function(m){ m.node.classList.toggle("ready", n >= m.at && !seen.has(m.i)); m.node.classList.toggle("seen", seen.has(m.i)); });
}
function paintStars(){ STARS.forEach(function(s){ s.node.classList.toggle("lit", lit.has(s.n)); s.node.setAttribute("aria-label", "Star " + s.n + (lit.has(s.n) ? ", lit" : "")); }); }

/* ---------- the card ---------- */
let current = null, replyT = null, sheetMode = "star", sheetOpenedAt = 0;
function tooSoon(){ return performance.now() - sheetOpenedAt < 600; }
function openStar(n){
  if(finaleOn) return;
  if(n === 100 && Array.from(lit).filter(function(x){ return x !== 100; }).length < 99){ toast("This one is waiting for you to finish the rest."); vib(15); return; }
  sheetMode = "star"; sheetOpenedAt = performance.now(); $("her").className = ""; $("revealBtn").style.display = "";
  current = n; const first = !lit.has(n); lit.add(n); saveLit(); paintStars(); updateHud();
  if(first && MEMS.some(function(m){ return m.at === lit.size; })) setTimeout(function(){ toast("A memory just lit up at the edge of the sky."); }, 1400);
  chime(noteFor(n)); if(n === 100) chord([523.25, 659.25, 783.99, 1046.5]);
  vib(n === 100 ? [30, 50, 30, 50, 120] : 14);
  const c = starClient(n); burst(c[0], c[1], first ? (n === 100 ? 46 : 16) : 6, n === 100 ? 170 : 70, n === 100);
  $("cardNo").textContent = "Your words, number " + n + " of 100";
  const paper = $("paper"); paper.className = SHEETS[Math.floor((n - 1) / 10)];
  paper.style.animation = "none"; void paper.offsetWidth; paper.style.animation = "";
  $("her").textContent = LINES[n - 1];
  $("mine").textContent = ""; $("revealBtn").classList.remove("gone"); $("nextBtn").classList.remove("on"); clearTimeout(replyT);
  $("nextBtn").textContent = n === 100 ? "Keep going" : (lit.size >= 100 ? "Continue" : "Light the next star");
  $("sheet").classList.add("open"); $("sheet").setAttribute("aria-hidden", "false");
}
function openMemory(i){
  if(finaleOn) return; const m = MEMS[i];
  if(lit.size < m.at){ toast("A memory is waiting here. Light a few more stars first."); vib(15); return; }
  sheetMode = "mem"; sheetOpenedAt = performance.now(); current = null; seen.add(i); store("k100:mem", JSON.stringify(Array.from(seen))); updateHud();
  chord([392, 493.88, 659.25]); vib([20, 40, 20]);
  const c = [innerWidth / 2, innerHeight * .4]; burst(c[0], c[1], 28, 120, true);
  $("cardNo").textContent = "A memory";
  const paper = $("paper"); paper.className = "memory"; paper.style.animation = "none"; void paper.offsetWidth; paper.style.animation = "";
  $("her").className = "memtitle"; $("her").textContent = m.title;
  $("revealBtn").style.display = "none"; $("mine").textContent = ""; $("nextBtn").classList.remove("on"); $("nextBtn").textContent = "Back to the stars";
  $("sheet").classList.add("open"); $("sheet").setAttribute("aria-hidden", "false");
  const dur = revealWords($("mine"), m.body, 130);
  setTimeout(function(){ $("nextBtn").classList.add("on"); }, Math.min(dur, 2800));
}
function closeSheet(){ $("sheet").classList.remove("open"); $("sheet").setAttribute("aria-hidden", "true"); }
$("revealBtn").addEventListener("click", function(){
  if(tooSoon()) return;
  $("revealBtn").classList.add("gone"); vib(10);
  const dur = revealWords($("mine"), reply(current), 140);
  chime(noteFor(current) * 1.5, {gain: .07, dur: 2.4, delay: .15});
  setTimeout(function(){ $("nextBtn").classList.add("on"); }, Math.min(dur, 2600));
});
function nextUnlit(from){
  const f = BYNUM[from]; let best = null, bd = 1e9;
  STARS.forEach(function(s){ if(lit.has(s.n) || s.n === 100) return; const d = Math.hypot(s.x - f.x, s.y - f.y); if(d < bd){ bd = d; best = s; } });
  return best ? best.n : null;
}
$("nextBtn").addEventListener("click", function(){
  if(tooSoon()) return;
  if(sheetMode === "mem"){ closeSheet(); return; }
  if(current === 100){ closeSheet(); startFinale(); return; }
  const nx = nextUnlit(current);
  if(nx){ openStar(nx); return; }
  if(!lit.has(100)){ closeSheet(); toast("Only the bright one is left."); return; }
  closeSheet(); startFinale();
});
$("closeBtn").addEventListener("click", function(){ if(!tooSoon()) closeSheet(); });
$("backdrop").addEventListener("click", function(){ if(!tooSoon()) closeSheet(); });
document.addEventListener("keydown", function(e){ if(e.key === "Escape") closeSheet(); });
$("endBtn").addEventListener("click", function(){ audio(); if(store("k100:done") === "1") openLetter(); else startFinale(); });

/* ---------- sound toggle ---------- */
function paintMute(){ $("muteBtn").textContent = muted ? "sound off" : "sound on"; $("muteBtn").setAttribute("aria-pressed", String(!muted)); }
$("muteBtn").addEventListener("click", function(){ muted = !muted; store("k100:mute", muted ? "1" : "0"); paintMute(); if(!muted) chime(659.25); });
paintMute();

/* ---------- intro ---------- */
let introDone = false;
function waitTap(node, ms){
  return new Promise(function(res){
    let done = false; const t = ms ? setTimeout(fin, ms) : null;
    function fin(){ if(done) return; done = true; clearTimeout(t); node.removeEventListener("pointerdown", fin); document.removeEventListener("keydown", kd); res(); }
    function kd(e){ if(e.key === "Enter" || e.key === " ") fin(); }
    node.addEventListener("pointerdown", fin); document.addEventListener("keydown", kd);
  });
}
async function runIntro(){
  const box = $("introText"), hint = $("introHint"), intro = $("intro");
  for(let i = 0; i < CONFIG.intro.length; i++){
    box.className = i === 0 ? "name" : "";
    hint.classList.remove("on");
    const dur = revealWords(box, CONFIG.intro[i], i === 0 ? 260 : 150);
    if(i === 0) { audio(); chime(523.25, {gain: .1, dur: 3}); }
    await sleep(Math.min(dur, 2800));
    hint.classList.add("on");
    if(i < CONFIG.intro.length - 1){
      await waitTap(intro);
      box.style.transition = "opacity .5s"; box.style.opacity = 0; await sleep(500); box.style.opacity = 1; box.textContent = "";
    }
  }
  $("beginBtn").classList.add("on"); $("soundNote").classList.add("on"); hint.classList.remove("on");
}
$("beginBtn").addEventListener("click", function(e){
  e.stopPropagation(); audio(); chime(783.99, {gain: .12, dur: 2.5}); vib(20);
  $("intro").classList.add("off"); $("sky").classList.remove("off"); introDone = true;
  burst(innerWidth / 2, innerHeight / 2, 24, 140);
});

/* ---------- finale ---------- */
let finaleOn = false, holdOK = false, holding = false, prog = 0, lastT = 0, lastBeat = 0, raf = null, completed = false;
(function(){
  let d = ""; for(let i = 0; i <= 160; i++){ const xy = heartXY(i / 160 * Math.PI * 2); const x = 100 + xy[0] * 5.9, y = 62 - (xy[1] + 2.6) * 5.9 + 30; d += (i ? "L" : "M") + x.toFixed(1) + "," + y.toFixed(1); }
  $("hFill").setAttribute("d", d + "Z"); $("hOutline").setAttribute("d", d + "Z");
})();
function setFill(p){ const h = 190 * p; $("hRect").setAttribute("y", String(190 - h)); $("hRect").setAttribute("height", String(h)); }
function tick(ts){
  const dt = lastT ? Math.min(150, ts - lastT) : 16; lastT = ts;
  prog += holding ? dt / 2800 : -dt / 1600; prog = Math.max(0, Math.min(1, prog)); setFill(prog);
  if(holding && ts - lastBeat > 820){ lastBeat = ts; thump(); vib([22, 70, 22]); }
  if(prog >= 1 && !completed){ completed = true; completeHold(); raf = null; return; }
  if(holding || prog > 0) raf = requestAnimationFrame(tick); else { raf = null; lastT = 0; }
}
function holdStart(e){
  if(!holdOK || completed) return; e.preventDefault(); e.stopPropagation(); audio(); holding = true; $("heartSvg").classList.add("beat");
  $("fHint").classList.remove("on");
  if(!raf){ lastT = 0; lastBeat = 0; raf = requestAnimationFrame(tick); }
}
function holdEnd(){ if(!holding) return; holding = false; $("heartSvg").classList.remove("beat"); }
$("heartBox").addEventListener("pointerdown", holdStart);
window.addEventListener("pointerup", holdEnd); window.addEventListener("pointercancel", holdEnd);
$("heartBox").addEventListener("contextmenu", function(e){ e.preventDefault(); });
function completeHold(){
  holding = false; holdOK = false; $("heartSvg").classList.add("beat"); setFill(1);
  chord([392, 523.25, 659.25, 783.99, 1046.5]); vib([40, 80, 40, 80, 200]);
  const r = $("heartBox").getBoundingClientRect(); const cx = r.left + r.width / 2, cy = r.top + r.height / 2;
  burst(cx, cy, 90, Math.max(innerWidth, innerHeight) * .55, true);
  setTimeout(function(){ burst(innerWidth / 2, innerHeight * .4, 60, 260, true); }, 500);
  setTimeout(function(){ burst(cx, cy, 50, 320, true); }, 1100);
  const fl = $("fLine"); fl.classList.add("out");
  setTimeout(function(){
    fl.classList.remove("out"); fl.classList.add("big"); revealWords(fl, CONFIG.finalLine, 280);
    $("fSign").textContent = CONFIG.signature; $("fSign").classList.add("on");
    $("fHint").textContent = CONFIG.afterHint; $("fHint").classList.add("on");
    $("backBtn").classList.add("on"); $("moreBtn").classList.add("on");
  }, 700);
  store("k100:done", "1");
}
async function startFinale(){
  if(finaleOn) return; finaleOn = true; closeSheet(); document.body.classList.add("ending"); $("finale").classList.remove("off"); $("sky").style.opacity = .5;
  const fl = $("fLine"), fin = $("finale"); completed = false; prog = 0; setFill(0); holdOK = false;
  fl.className = ""; fl.textContent = ""; $("fSign").classList.remove("on"); $("fSign").textContent = ""; $("backBtn").classList.remove("on"); $("moreBtn").classList.remove("on"); $("fHint").classList.remove("on");
  setTimeout(function(){ $("heartSvg").classList.add("drawn"); }, 600);
  chord([392, 523.25, 659.25]);
  await sleep(900);
  for(let i = 0; i < CONFIG.finale.length; i++){
    fl.classList.remove("out");
    const dur = revealWords(fl, CONFIG.finale[i], 150);
    await Promise.race([sleep(dur + 2400), waitTap(fin, dur + 2400)]);
    fl.classList.add("out"); await sleep(650);
  }
  fl.classList.remove("out"); fl.textContent = ""; revealWords(fl, CONFIG.holdPrompt, 150);
  holdOK = true; $("heartBox").style.cursor = "pointer";
}
$("backBtn").addEventListener("click", function(e){
  e.stopPropagation(); finaleOn = false; document.body.classList.remove("ending"); $("finale").classList.add("off"); $("sky").style.opacity = 1;
  $("heartSvg").classList.remove("drawn", "beat"); updateHud();
});

/* ---------- the letter ---------- */
let letterBuilt = false, letterIO = null;
function rich(el, text){
  text.split("**").forEach(function(part, i){
    if(!part) return; if(i % 2){ const st = document.createElement("strong"); st.textContent = part; el.appendChild(st); }
    else el.appendChild(document.createTextNode(part));
  });
}
function buildLetter(){
  if(letterBuilt) return; letterBuilt = true; const body = $("letterBody");
  LETTER.forEach(function(b){
    const d = document.createElement("div"); const kind = b.kind || "";
    d.className = "blk" + (kind ? " " + kind : "");
    if(kind === "msg"){ const p = document.createElement("p"); rich(p, b.x); d.appendChild(p); }
    else if(kind === "ask"){ const h = document.createElement("h2"); h.textContent = b.t; d.appendChild(h); d.dataset.burst = "1"; }
    else{
      const gem = document.createElement("div"); gem.className = "gem"; if(kind === "diya") gem.textContent = "\uD83E\uDE94";
      const h = document.createElement("h2"); h.textContent = b.t; const p = document.createElement("p"); p.textContent = b.b;
      d.appendChild(gem); d.appendChild(h); d.appendChild(p);
      if(kind === "sign"){ const dt = document.createElement("div"); dt.className = "date"; dt.textContent = "With all my love, " + CONFIG.signature + "  -  " + CONFIG.date; d.appendChild(dt); d.dataset.chord = "1"; }
    }
    body.appendChild(d);
  });
  if("IntersectionObserver" in window){
    letterIO = new IntersectionObserver(function(es){
      es.forEach(function(e){
        if(!e.isIntersecting || e.target.classList.contains("in")) return;
        e.target.classList.add("in"); vib(6); chime(noteFor(Math.floor(Math.random() * 40) + 1), {gain: .04, dur: 2.2});
        if(e.target.dataset.burst){ chord([392, 523.25, 659.25, 783.99]); burst(innerWidth / 2, innerHeight * .45, 80, 260, true); vib([30, 60, 30]); }
        if(e.target.dataset.chord){ chord([349.23, 440, 523.25]); burst(innerWidth / 2, innerHeight * .4, 40, 200, true); }
      });
    }, {root: $("letterScroll"), threshold: .25});
    Array.prototype.forEach.call(body.children, function(c){ letterIO.observe(c); });
  }else{ Array.prototype.forEach.call(body.children, function(c){ c.classList.add("in"); }); }
  $("letterScroll").addEventListener("scroll", function(){
    const sc = $("letterScroll"); const m = sc.scrollHeight - sc.clientHeight; $("lprog").style.width = (m > 0 ? sc.scrollTop / m * 100 : 0) + "%";
  }, {passive: true});
}
function openLetter(){ document.body.classList.add("reading"); buildLetter(); $("letterScroll").scrollTop = 0; $("letter").classList.remove("off"); chord([392, 523.25]); }
$("moreBtn").addEventListener("click", function(e){ e.stopPropagation(); openLetter(); });
$("letterClose").addEventListener("click", function(){ $("letter").classList.add("off"); document.body.classList.remove("reading"); });

/* ---------- start ---------- */
paintStars(); updateHud();
if(lit.size > 0 && !hm){
  $("intro").classList.add("off"); $("sky").classList.remove("off"); introDone = true;
  setTimeout(function(){ toast("Welcome back, " + CONFIG.name + "."); }, 600);
}else if(hm){
  $("intro").classList.add("off"); $("sky").classList.remove("off"); introDone = true;
}else{
  runIntro();
}
</script>
